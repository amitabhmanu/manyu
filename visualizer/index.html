<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manyu Timeline Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Manyu State Observatory</h1>
        <p id="sourceLabel">Load a timeline JSON export to inspect affect, belief formation, and worldview evolution.</p>
      </div>
      <div class="toolbar">
        <label class="fileButton">
          Load JSON
          <input id="fileInput" type="file" accept="application/json,.json" />
        </label>
        <button id="sampleButton" type="button">Sample</button>
      </div>
    </header>

    <section id="overview" class="overview" aria-label="State overview"></section>

    <main class="layout">
      <div class="mainColumn">
        <section class="timelinePanel">
          <div class="panelHeader">
            <h2>Affective Trajectory</h2>
            <div id="agentTabs" class="tabs" aria-label="Agent selector"></div>
          </div>
          <canvas id="chart" width="1100" height="380"></canvas>
          <div class="legendGuide">
            <span><span class="lineSample solid"></span>authoritative state</span>
            <span><span class="lineSample dashed"></span>partial interoception</span>
            <span><span class="beliefMarkSample"></span>belief evidence</span>
          </div>
          <div id="legend" class="legend"></div>
        </section>

        <section class="moodPanel">
          <div class="panelHeader">
            <h2>Inner Voice & Mood</h2>
            <span id="moodCount" class="muted"></span>
          </div>
          <div id="moodLane" class="moodLane"></div>
        </section>

        <section class="worldviewPanel">
          <div class="panelHeader">
            <h2>Worldview Evolution</h2>
            <span id="beliefCount" class="muted"></span>
          </div>
          <div id="worldview" class="worldview"></div>
        </section>
      </div>

      <section class="turnsPanel">
        <div class="panelHeader">
          <h2>Turns</h2>
          <span id="turnCount" class="muted"></span>
        </div>
        <div id="turnList" class="turnList"></div>
      </section>

      <aside class="detailPanel">
        <div class="panelHeader">
          <h2>Inspector</h2>
        </div>
        <div id="detail" class="detail"></div>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
